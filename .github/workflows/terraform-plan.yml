name: terraform-plan

# PR 上で dev / prod の plan を Workload Identity Federation（長期キー不要）で実行し、結果を PR コメントに出す。
# GitHub Secrets（GCP_PROJECT / GCP_WIF_PROVIDER / GCP_PLAN_SA）が未設定の間は、認証以降のステップをスキップする。
# 公開リポジトリのため、コメントに貼る前にプロジェクト ID を伏せ字にする。
on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".github/workflows/terraform-plan.yml"
      - ".github/actions/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # fork からの PR にはクラウドの権限を渡さない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      ENV: ${{ matrix.env }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      TG_NON_INTERACTIVE: "true"
    steps:
      # secrets は job の if で参照できないため、ステップで設定の有無を判定する
      - name: Check configuration
        id: gate
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          PLAN_SA: ${{ secrets.GCP_PLAN_SA }}
        run: |
          if [ -n "$GCP_PROJECT" ] && [ -n "$WIF_PROVIDER" ] && [ -n "$PLAN_SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP の Secrets が未設定のため、plan をスキップします。"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'

      - uses: ./.github/actions/setup-tools
        if: steps.gate.outputs.enabled == 'true'

      - uses: google-github-actions/auth@v3
        if: steps.gate.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SA }}

      - name: terragrunt plan
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          terragrunt plan -no-color -input=false -lock-timeout=60s 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/github-script@v9
        env:
          ENV_NAME: ${{ matrix.env }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            let out = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : '(no output)';
            // 公開リポジトリのコメントにプロジェクト ID を出さない
            const secret = process.env.GCP_PROJECT;
            if (secret) out = out.split(secret).join('***');
            const max = 60000;
            if (out.length > max) out = '... (truncated)\n' + out.slice(-max);
            const marker = `<!-- terraform-plan-${env} -->`;
            const icon = process.env.OUTCOME === 'success' ? '✅' : '❌';
            const body = [
              marker,
              `### ${icon} terragrunt plan (\`${env}\`)`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              out,
              '```',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.gate.outputs.enabled == 'true' && steps.plan.outcome != 'success'
        run: exit 1
